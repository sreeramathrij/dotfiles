[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Neovim" }
]

[open]
rules = [
  { url = "*/", use = "edit" },
  { mime = "text/*", use = "edit" },
  { mime = "application/x-subrip", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { mime = "application/javascript", use = "edit" },
]
