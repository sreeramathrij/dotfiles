background {
    monitor =
    path = screenshot
    blur_passes = 
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_fade_in = false
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    rounding = 0
    border_color = rgb(89b4fa)
}

text {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
