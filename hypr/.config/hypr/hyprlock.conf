# NEOBRIX LOCK / dusk — Neo-brutalist layout, 1920x1080-friendly.
# Generated by the opt-in local kit, no network required at lock time.

$font = JetBrainsMono Nerd Font
$ink = rgb(0D0A08)
$accent = rgb(F0A377)
$surface = rgb(2E241C)
$subsurface = rgb(191310)
$text = rgb(F6EDE2)
$muted = rgb(B5A28F)
$success = rgb(9FD08F)

# Unlock never relies on an external QML process, network, or wallpaper.
general {
    hide_cursor = true
    immediate_render = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/rombie/.local/state/neobrix/lock-background.png
    color = rgb(14100E)
    blur_passes = 0
}

# Solid drop-shadow 'slab', offset down-right by 10 px.
shape {
    monitor =
    size = 636, 406
    color = rgb(000000)
    rounding = 5
    position = 11, -11
    halign = center
    valign = center
    zindex = 1
}

# Main contrasting card + thick border.
shape {
    monitor =
    size = 636, 406
    color = $surface
    border_size = 4
    border_color = $ink
    rounding = 5
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}

# Orange masthead.
shape {
    monitor =
    size = 630, 68
    color = $accent
    border_size = 0
    rounding = 0
    position = 0, 167
    halign = center
    valign = center
    zindex = 3
}

# Divider near the input.
shape {
    monitor =
    size = 550, 3
    color = $ink
    rounding = 0
    position = 0, -46
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = NB / LOCKED SESSION
    color = $ink
    font_family = $font
    font_size = 23
    position = 0, 167
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = $TIME
    color = $text
    font_family = $font
    font_size = 83
    position = 0, 60
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = cmd[update:60000] date '+%A  /  %d %B %Y'
    color = $muted
    font_family = $font
    font_size = 16
    position = 0, -10
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = $USER  //  AUTHENTICATE TO CONTINUE
    color = $text
    font_family = $font
    font_size = 13
    position = 0, -80
    halign = center
    valign = center
    zindex = 4
}

input-field {
    monitor =
    size = 494, 52
    outline_thickness = 3
    dots_size = 0.24
    dots_spacing = 0.22
    dots_center = true
    dots_fade_in = false
    fade_on_empty = false
    rounding = 4
    outer_color = $ink
    inner_color = $subsurface
    font_color = $text
    font_family = $font
    placeholder_text = TYPE PASSWORD AND PRESS ENTER
    check_color = $success
    fail_color = rgb(E8776B)
    fail_text = AUTH FAILED  //  $ATTEMPTS ATTEMPTS
    capslock_color = rgb(EBC963)
    position = 0, -140
    halign = center
    valign = center
    zindex = 5
}

# Ambient corner tags are cheap native labels: no polling/processes.
label {
    monitor =
    text = NEOBRIX // DUSK
    color = rgb(F0A377)
    font_family = $font
    font_size = 15
    position = 46, -36
    halign = left
    valign = top
    zindex = 4
}

label {
    monitor =
    text = ESC: CLEAR INPUT     //     SECURE DESKTOP
    color = rgb(F0A377)
    font_family = $font
    font_size = 13
    position = -46, 36
    halign = right
    valign = bottom
    zindex = 4
}
